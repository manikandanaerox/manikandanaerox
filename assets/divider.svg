<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="divider">
<defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#8EB8E0" stop-opacity="0"/><stop offset=".85" stop-color="#8EB8E0" stop-opacity=".5"/><stop offset="1" stop-color="#E0925A"/></linearGradient></defs>
<style>@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.trail{transform-box:fill-box;transform-origin:0 50%;animation:trail 7s linear infinite}
@keyframes trail{0%{transform:scaleX(0);opacity:1}85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.ship{animation:ship 7s linear infinite}
@keyframes ship{0%{transform:translateX(0)}85%{transform:translateX(1200px)}100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<line x1="0" y1="18" x2="1200" y2="18" stroke="#2B3140" stroke-dasharray="2 6"/>
<rect class="trail" x="0" y="17" width="1200" height="2" fill="url(#t)"/>
<g class="ship"><g transform="translate(0 18)">
  <circle r="7" fill="#E0925A" opacity=".35"/>
  <path d="M-10,-4 L6,-4 L12,0 L6,4 L-10,4 Z" fill="#E9EEF8"/><path d="M-10,-4 L-14,-8 L-14,8 L-10,4 Z" fill="#C65A43"/>
</g></g>
</svg>
