<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Key numbers: 100+ flight hours, Jury's Favourite among 28 teams, 20-member team founded, 3498 K, Mach 3, EU drone pilot">
<title>Key numbers: 100+ flight hours, Jury's Favourite among 28 teams, 20-member team founded, 3498 K, Mach 3, EU drone pilot</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0C1428"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="140" rx="16"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>

</defs>
<style>
.sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 4s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes bar{0%{transform:scaleX(0)}40%,85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="140" fill="url(#bg)"/>
<g>
  <text x="28.0" y="58" class="sans" font-size="30" font-weight="800" fill="#E9EEF8">100+</text>
  <text x="28.0" y="84" class="mono" font-size="11" letter-spacing="1.5" fill="#5CD4FF">FLIGHT HOURS</text>
  <text x="28.0" y="102" class="sans" font-size="11.5" fill="#8693AB">as drone pilot</text>
  <rect x="28.0" y="116" width="144" height="3" rx="1.5" fill="#22304F"/>
  <rect x="28.0" y="116" width="144" height="3" rx="1.5" fill="#5CD4FF" class="bar" style="animation-delay:0.00s"/>
</g><g>
  <text x="228.0" y="58" class="sans" font-size="30" font-weight="800" fill="#E9EEF8">★ 2026</text>
  <text x="228.0" y="84" class="mono" font-size="11" letter-spacing="1.5" fill="#FFD27A">JURY’S FAVOURITE</text>
  <text x="228.0" y="102" class="sans" font-size="11.5" fill="#8693AB">Dassault UAV · 28 teams</text>
  <rect x="228.0" y="116" width="144" height="3" rx="1.5" fill="#22304F"/>
  <rect x="228.0" y="116" width="144" height="3" rx="1.5" fill="#FFD27A" class="bar" style="animation-delay:0.25s"/>
</g><line x1="200" y1="26" x2="200" y2="114" stroke="#22304F"/><g>
  <text x="428.0" y="58" class="sans" font-size="30" font-weight="800" fill="#E9EEF8">20</text>
  <text x="428.0" y="84" class="mono" font-size="11" letter-spacing="1.5" fill="#5CD4FF">CREW FOUNDED</text>
  <text x="428.0" y="102" class="sans" font-size="11.5" fill="#8693AB">Team Phoenix · SAE</text>
  <rect x="428.0" y="116" width="144" height="3" rx="1.5" fill="#22304F"/>
  <rect x="428.0" y="116" width="144" height="3" rx="1.5" fill="#5CD4FF" class="bar" style="animation-delay:0.50s"/>
</g><line x1="400" y1="26" x2="400" y2="114" stroke="#22304F"/><g>
  <text x="628.0" y="58" class="sans" font-size="30" font-weight="800" fill="#E9EEF8">3,498 K</text>
  <text x="628.0" y="84" class="mono" font-size="11" letter-spacing="1.5" fill="#FF8A2A">H₂/O₂ FLAME</text>
  <text x="628.0" y="102" class="sans" font-size="11.5" fill="#8693AB">adiabatic, Cantera</text>
  <rect x="628.0" y="116" width="144" height="3" rx="1.5" fill="#22304F"/>
  <rect x="628.0" y="116" width="144" height="3" rx="1.5" fill="#FF8A2A" class="bar" style="animation-delay:0.75s"/>
</g><line x1="600" y1="26" x2="600" y2="114" stroke="#22304F"/><g>
  <text x="828.0" y="58" class="sans" font-size="30" font-weight="800" fill="#E9EEF8">M 3</text>
  <text x="828.0" y="84" class="mono" font-size="11" letter-spacing="1.5" fill="#FF8A2A">ATREX CYCLE</text>
  <text x="828.0" y="102" class="sans" font-size="11.5" fill="#8693AB">at 12 km altitude</text>
  <rect x="828.0" y="116" width="144" height="3" rx="1.5" fill="#22304F"/>
  <rect x="828.0" y="116" width="144" height="3" rx="1.5" fill="#FF8A2A" class="bar" style="animation-delay:1.00s"/>
</g><line x1="800" y1="26" x2="800" y2="114" stroke="#22304F"/><g>
  <text x="1028.0" y="58" class="sans" font-size="30" font-weight="800" fill="#E9EEF8">A1/A3</text>
  <text x="1028.0" y="84" class="mono" font-size="11" letter-spacing="1.5" fill="#3DDC97">EU DRONE PILOT</text>
  <text x="1028.0" y="102" class="sans" font-size="11.5" fill="#8693AB">DGAC certified</text>
  <rect x="1028.0" y="116" width="144" height="3" rx="1.5" fill="#22304F"/>
  <rect x="1028.0" y="116" width="144" height="3" rx="1.5" fill="#3DDC97" class="bar" style="animation-delay:1.25s"/>
</g><line x1="1000" y1="26" x2="1000" y2="114" stroke="#22304F"/>
</g>
<rect x=".5" y=".5" width="1199" height="139" rx="16" fill="none" stroke="#22304F"/>
</svg>
