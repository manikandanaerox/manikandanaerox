<path class="regen" d="M70,265 L230,265 C262,265 272,234 290,234 C330,234 400,260 470,282" fill="none" stroke="#5CD4FF" stroke-width="1.5" transform="translate(0 6)"/>
<rect x="62" y="160" width="10" height="110" rx="2" fill="#6B7894"/>
<g class="mono" font-size="10" fill="#8693AB">
  <text x="290" y="182" text-anchor="middle">throat</text>
