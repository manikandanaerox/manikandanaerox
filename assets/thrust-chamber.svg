</g>
<path d="M470,148 L600,118 L600,312 L470,282 Z" fill="url(#plumeT)"/>
<path class="sd" style="animation-delay:0.00s" d="M475.0,215 L498,163.0 L521.0,215 L498,267.0 Z" fill="#FFFFFF" fill-opacity=".14" stroke="#FFF2D0" stroke-width="1.2"/><path class="sd" style="animation-delay:-0.12s" d="M528.0,215 L548,173.0 L568.0,215 L548,257.0 Z" fill="#FFFFFF" fill-opacity=".14" stroke="#FFF2D0" stroke-width="1.2"/><path class="sd" style="animation-delay:-0.24s" d="M575.0,215 L592,182.0 L609.0,215 L592,248.0 Z" fill="#FFFFFF" fill-opacity=".14" stroke="#FFF2D0" stroke-width="1.2"/>
