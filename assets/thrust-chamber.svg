<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="Animated H2/O2 rocket thrust chamber with Mach diamonds">
<title>Animated H2/O2 rocket thrust chamber with Mach diamonds</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0C1428"/></linearGradient>
<clipPath id="frame"><rect width="600" height="380" rx="16"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>

<linearGradient id="chG" x1="0" x2="1"><stop offset="0" stop-color="#FFD27A" stop-opacity=".7"/><stop offset=".25" stop-color="#FFFFFF"/><stop offset=".52" stop-color="#FFD27A"/><stop offset=".75" stop-color="#FF8A2A" stop-opacity=".85"/><stop offset="1" stop-color="#FF4D3D" stop-opacity=".6"/></linearGradient>
<linearGradient id="plumeT" x1="0" x2="1"><stop offset="0" stop-color="#FFD27A" stop-opacity=".8"/><stop offset="1" stop-color="#FF8A2A" stop-opacity="0"/></linearGradient>
<clipPath id="gasT"><path d="M70,165 L230,165 C262,165 272,196 290,196 C330,196 400,170 470,148 L470,282 C400,260 330,234 290,234 C272,234 262,265 230,265 L70,265 Z"/></clipPath>

</defs>
<style>
.sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spray{0%{transform:translateX(0);opacity:1}100%{transform:translateX(70px);opacity:0}}
.sd{animation:sd .3s ease-in-out infinite alternate}
@keyframes sd{from{opacity:.3}to{opacity:1}}
.core{animation:core .12s ease-in-out infinite alternate}
@keyframes core{from{opacity:.82}to{opacity:1}}
.lh2{stroke-dasharray:6 10;animation:flow .8s linear infinite}
.regen{stroke-dasharray:4 8;animation:flow 1.1s linear infinite reverse}
</style>
<g clip-path="url(#frame)">
<rect width="600" height="380" fill="url(#bg)"/>

<circle cx="69.0" cy="201.7" r="1" fill="#fff" style="animation:twinkle 4.40s ease-in-out 1.81s infinite"/>
