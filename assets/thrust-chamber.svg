<circle cx="557.1" cy="339.8" r="0.6" fill="#fff" style="animation:twinkle 4.14s ease-in-out 0.06s infinite"/>
<circle cx="156.2" cy="89.7" r="0.8" fill="#fff" style="animation:twinkle 4.33s ease-in-out 2.98s infinite"/>
<circle cx="196.1" cy="334.5" r="1" fill="#fff" style="animation:twinkle 3.30s ease-in-out 1.52s infinite"/>
<text x="24" y="34" class="mono" font-size="12.5" letter-spacing="3" fill="#FF8A2A">COMBUSTION // H₂ + O₂</text>
<text x="24" y="54" class="sans" font-size="12" fill="#8693AB">Cantera · equilibrium &amp; dissociation, 0.1 → 10⁴ MPa</text>
<!-- feed lines -->
<path class="lh2" d="M40,90 H58 V180" stroke="#5CD4FF" stroke-width="2.5" fill="none"/>
