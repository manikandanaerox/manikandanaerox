<circle cx="318.9" cy="154.3" r="0.8" fill="#fff" style="animation:twinkle 1.98s ease-in-out 3.65s infinite"/>
<circle cx="63.0" cy="232.8" r="0.8" fill="#fff" style="animation:twinkle 1.93s ease-in-out 0.80s infinite"/>
